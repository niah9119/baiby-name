spring:
  application:
    name: baiby-name
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  mvc:
    hiddenmethod:
      filter:
        method-override: false
  datasource:
    url: jdbc:postgresql://localhost:5432/baibyname
    username: baibyname
    password: baibyname
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  actuator:
    health:
      show-details: when_authorized
    endpoints:
      web:
        exposure:
          include: health,info

server:
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.baibyname: DEBUG
    org.flywaydb: INFO
