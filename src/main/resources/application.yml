app:
  base-url: http://localhost:8080

spring:
  application:
    name: baiby-name
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  mvc:
    hiddenmethod:
      filter:
        method-override: false
  datasource:
    url: jdbc:postgresql://localhost:5432/baibyname
    username: baibyname
    password: baibyname
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    # Keep the persistence context out of view rendering: with OSIV on, a lazy
    # association touched by a template silently issues a query and holds a
    # connection for the whole request. Decided explicitly while there are no
    # views yet -- it is far cheaper to set now than to unpick later.
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  actuator:
    health:
      show-details: when_authorized
    endpoints:
      web:
        exposure:
          include: health,info

server:
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.baibyname: DEBUG
    org.flywaydb: INFO
