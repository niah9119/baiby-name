# Privacy Policy
privacy.title=Integritetspolicy
privacy.intro.title=Introduktion
privacy.intro.text=BaibyName ("vi", "vårt", eller "vårt") är åtagande att skydda din integritet och personliga data. Denna integritetspolicy förklarar hur vi samlar in, använder och säkerhetsställer din information när du använder vår webbplats och tjänster.
privacy.data.title=Information vi samlar in
privacy.data.text=När du skapar ett konto samlar vi in din e-postadress och ett lösenordshash. Vi samlar inte in känslig personlig data såsom hälsoinformation eller biometrisk data.
privacy.cookies.title=Kakor och spårning
privacy.cookies.text=Vi använder kakor för att komma ihåg dina preferenser och bibehålla din session. Du kan hantera dina kakpreferenser när som helst genom vår samtyckesbanner.
privacy.shortlist.title=Din kortlista
privacy.shortlist.text=Din kortlista med favoritnamn lagras säkert och kopplas till ditt konto. Du kan ta bort din kortlista när som helst genom att ta bort ditt konto.
privacy.erasure.title=Dina rättigheter
privacy.erasure.text=Enligt GDPR har du rätt att:
privacy.right.access=Komma åt dina personliga data
privacy.right.rectify=Begära korrigering av dina data
privacy.right.erase=Begära borttagning av dina data
privacy.right.object=Objektera behandling av dina data
privacy.contact.title=Kontakta oss
privacy.contact.text=Om du har några frågor om denna integritetspolicy eller dina data, vänligen kontakta oss på privacy@baibyname.com.
privacy.thirdparty.text=Obs: Vi delar inte dina personliga data med tredje part såvida det inte är nödvändigt för att tillhandahålla våra tjänster (t.ex. vår hostingleverantör). Vi säljer inte dina data till annonsörer.

