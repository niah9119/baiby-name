<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:insert="layout :: head">
    <title>Account - BaibyName</title>
</head>
<body>
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="max-w-md mx-auto">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        Your Account
                    </h1>
                    <p class="text-gray-600">
                        Manage your account settings and preferences.
                    </p>
                </div>

                <div class="card">
                    <div class="text-center py-4">
                        <p class="text-gray-600 mb-4">
                            You are logged in and can access your shortlist.
                        </p>
                        <a href="/shortlist" class="btn-primary inline-block" th:text="#{nav.shortlist}">
                            Go to Shortlist
                        </a>
                    </div>

                    <div class="mt-6 text-center">
                        <p class="text-sm text-gray-600">
                            <a href="/delete-account" class="text-red-600 hover:text-red-800 font-medium">
                                Delete your account
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
