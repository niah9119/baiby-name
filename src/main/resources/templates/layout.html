<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:with="title=${title ?: 'BaibyName'}" th:text="${title} + ' - BaibyName'">BaibyName</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background-color: #f9fafb;
        }
        .nav-link {
            @apply text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors;
        }
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors;
        }
        .btn-secondary {
            @apply bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors;
        }
        .card {
            @apply bg-white rounded-xl shadow-sm p-6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="font-bold text-xl text-blue-600">
                            <i class="fa-solid fa-child-reaching mr-2"></i>BaibyName
                        </a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="#" class="nav-link" th:text="#{nav.browse}">Browse</a>
                        <a href="#" class="nav-link" th:text="#{nav.interview}">Interview</a>
                        <a href="#" class="nav-link" th:text="#{nav.shortlist}">Shortlist</a>
                    </div>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <div class="ml-3 relative">
                        <button class="btn-secondary" th:text="#{nav.login}">
                            <i class="fa-solid fa-user mr-2"></i>Log in
                        </button>
                    </div>
                    <!-- Language Switcher -->
                    <div class="ml-3 relative">
                        <select id="language-switcher" class="btn-secondary cursor-pointer">
                            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                            <option value="sv" th:selected="${#locale.language == 'sv'}">Svenska</option>
                        </select>
                        <script>
                            document.getElementById('language-switcher').addEventListener('change', function(e) {
                                var lang = e.target.value;
                                // Make a POST request to change the locale
                                // We need to add a form or use AJAX with CSRF token
                                // For simplicity, we'll use a GET request with lang parameter
                                // The LocaleChangeInterceptor handles this
                                window.location.href = window.location.pathname + '?lang=' + lang;
                            });
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <th:block th:insert="${content}"/>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500" th:text="#{footer.copyright}">
                &copy; 2026 BaibyName. Helping expecting parents choose the perfect name.
            </p>
        </div>
    </footer>
</body>
</html>
