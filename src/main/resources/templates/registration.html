<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:insert="layout :: head">
    <title th:text="#{registration.title}">Register - BaibyName</title>
</head>
<body>
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="max-w-md mx-auto">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2" th:text="#{registration.title}">
                        Create an account
                    </h1>
                    <p class="text-gray-600" th:text="#{registration.subtitle}">
                        Join thousands of expecting parents finding the perfect name.
                    </p>
                </div>

                <div class="card">
                    <form th:if="${success == null or !success}" th:action="@{/register}" method="post" th:object="${registrationForm}">
                        <div class="mb-4">
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1" th:text="#{form.email}">
                                Email address
                            </label>
                            <input type="email" th:field="*{email}" id="email"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   th:placeholder="#{form.email.placeholder}" required>
                            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Invalid email
                            </p>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1" th:text="#{form.password}">
                                Password
                            </label>
                            <input type="password" th:field="*{password}" id="password"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   th:placeholder="#{form.password.placeholder}" required>
                            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                Password error
                            </p>
                        </div>

                        <div class="mb-6">
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1" th:text="#{form.password.confirm}">
                                Confirm password
                            </label>
                            <input type="password" th:field="*{confirmPassword}" id="confirmPassword"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                            <p class="text-red-600 text-sm mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                                Passwords do not match
                            </p>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors" th:text="#{form.register}">
                            Register
                        </button>
                    </form>

                    <div th:if="${success}">
                        <div class="text-center py-4">
                            <i class="fa-solid fa-check-circle text-4xl text-green-600 mb-4"></i>
                            <h2 class="text-xl font-semibold text-gray-900 mb-2" th:text="#{registration.success.title}">
                                Registration successful!
                            </h2>
                            <p class="text-gray-600 mb-4" th:text="#{registration.success.message}">
                                You can now log in with your email and password.
                            </p>
                            <a href="/login" class="btn-primary inline-block" th:text="#{form.login}">
                                Log in
                            </a>
                        </div>
                    </div>

                    <div class="mt-6 text-center">
                        <p class="text-sm text-gray-600">
                            Already have an account?
                            <a href="/login" class="text-blue-600 hover:text-blue-800 font-medium" th:text="#{form.login.link}">
                                Log in here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
