<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:insert="~{layout :: head}">
    <title th:text="#{nav.interview}">BaibyName - Interview</title>
    <style>
        #chat-container {
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background-color: #f9fafb;
        }
        .chat-message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .chat-message.assistant {
            background-color: #e0f2fe;
            align-self: flex-start;
        }
        .chat-message.user {
            background-color: #e5e7eb;
            align-self: flex-end;
        }
        .chat-message.system {
            background-color: #f3f4f6;
            font-size: 0.875rem;
            color: #6b7280;
        }
        .chat-message.tool-result {
            background-color: #f0fdf4;
            font-size: 0.875rem;
            color: #166534;
        }
        #chat-input-container {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background-color: white;
            border-top: 1px solid #e5e7eb;
        }
        #chat-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        #send-btn {
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        #send-btn:hover {
            background-color: #1d4ed8;
        }
        #send-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        #chat-status {
            padding: 0.5rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .busy-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message-content {
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="flex-grow">
        <!-- Interview Layout -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2" th:text="#{nav.interview}">Interview</h1>
                <p class="text-gray-600" th:text="#{interview.description}">Have a conversation with our assistant to narrow down your name search.</p>
            </div>

            <div id="chat-container">
                <!-- Chat Messages Area -->
                <div id="chat-messages">
                    <div class="chat-message assistant">
                        <p class="message-content" th:text="#{introduction.message}">Hello! I'm here to help you find the perfect name for your baby. Let's start with a simple question: Would you like to filter by boy names, girl names, or both?</p>
                    </div>
                </div>

                <!-- Chat Status -->
                <div id="chat-status">
                    <div id="busy-indicator" class="busy-indicator" style="display: none;">
                        <div class="spinner"></div>
                        <span th:text="#{chat.busy}">Assistant is thinking...</span>
                    </div>
                </div>

                <!-- Chat Input -->
                <div id="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                    <button id="send-btn" th:text="#{chat.send}">Send</button>
                </div>
            </div>
        </div>
    </main>

    <!-- HTMX Script for SSE -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const busyIndicator = document.getElementById('busy-indicator');

            // Create EventSource for SSE
            let eventSource = null;
            let lastToolResult = null;

            function startSSE() {
                if (eventSource) {
                    eventSource.close();
                }

                eventSource = new EventSource('/interview/stream?message=' + encodeURIComponent('Start interview'));

                eventSource.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'message') {
                            addChatMessage('assistant', data.content);
                        } else if (data.type === 'toolResult') {
                            addChatMessage('toolResult', 'Filter updated: ' + data.toolName);
                        } else if (data.type === 'done') {
                            eventSource.close();
                            sendBtn.disabled = false;
                            showBusy(false);
                        }
                    } catch (e) {
                        console.error('Error parsing SSE message:', e);
                    }
                };

                eventSource.onerror = function(error) {
                    console.error('SSE error:', error);
                    eventSource.close();
                    sendBtn.disabled = false;
                    showBusy(false);
                };
            }

            function showBusy(show) {
                busyIndicator.style.display = show ? 'flex' : 'none';
            }

            function addChatMessage(role, content) {
                const div = document.createElement('div');
                div.className = 'chat-message ' + role;
                div.innerHTML = '<p class="message-content">' + content + '</p>';
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Send message on button click
            sendBtn.addEventListener('click', function() {
                const message = chatInput.value.trim();
                if (!message) return;

                // Add user message to chat
                addChatMessage('user', message);
                chatInput.value = '';

                // Show busy indicator
                sendBtn.disabled = true;
                showBusy(true);

                // Start SSE stream
                startSSE();
            });

            // Send message on Enter key
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendBtn.click();
                }
            });

            // Update filter state via HTMX when filter changes
            document.addEventListener('htmx:afterRequest', function(evt) {
                // Refresh chat status if needed
                if (evt.detail.request.xhr.getResponseHeader('Content-Type')?.includes('application/json')) {
                    // Handle JSON response
                }
            });
        });
    </script>
</body>
</html>
