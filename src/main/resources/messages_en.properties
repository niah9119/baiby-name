# Privacy Policy
privacy.title=Privacy Policy
privacy.intro.title=Introduction
privacy.intro.text=BaibyName ("we", "our", or "our") is committed to protecting your privacy and personal data. This privacy policy explains how we collect, use, and safeguard your information when you use our website and services.
privacy.data.title=Information We Collect
privacy.data.text=When you create an account, we collect your email address and a password hash. We do not collect sensitive personal data such as health information or biometric data.
privacy.cookies.title=Cookies and Tracking
privacy.cookies.text=We use cookies to remember your preferences and maintain your session. You can manage your cookie preferences at any time through our consent banner.
privacy.shortlist.title=Your Shortlist
privacy.shortlist.text=Your shortlist of favorite names is stored securely and associated with your account. You can delete your shortlist at any time by deleting your account.
privacy.erasure.title=Your Rights
privacy.erasure.text=Under GDPR, you have the right to:
privacy.right.access=Access your personal data
privacy.right.rectify=Request correction of your data
privacy.right.erase=Request deletion of your data
privacy.right.object=Object to processing of your data
privacy.contact.title=Contact Us
privacy.contact.text=If you have any questions about this privacy policy or your data, please contact us at privacy@baibyname.com.
privacy.thirdparty.text=Note: We do not share your personal data with third parties except as necessary to provide our services (e.g., our hosting provider). We do not sell your data to advertisers.
