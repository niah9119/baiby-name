# Docker 29 raised the daemon's minimum API version to 1.44, but Testcontainers 1.x
# hardcodes 1.32 and fails detection ("client version 1.32 is too old").
# Pinning 1.44 here is the documented workaround for Testcontainers 1.x
# (testcontainers-java issue #11210); requires Docker Engine >= 25.
# Remove this file when the project moves to Testcontainers 2.x, which negotiates.
api.version=1.44
