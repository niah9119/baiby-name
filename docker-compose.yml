services:
  postgres:
    image: postgres:16-alpine
    container_name: baiby-name-postgres
    environment:
      POSTGRES_DB: baibyname
      POSTGRES_USER: baibyname
      POSTGRES_PASSWORD: baibyname
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baibyname -d baibyname"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
