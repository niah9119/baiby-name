name: CI

on:
  pull_request:
  push:
    branches: [main]

# A branch that gets pushed repeatedly (agent correction runs) should not queue up
# builds; only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest runners ship one.
      - name: Build and test
        run: ./mvnw -B verify

      # A skipped test is a test that did not run. The agent prompt forbids disabling
      # tests to get a green build, and this is what actually enforces it -- surefire
      # reports "success" for a skipped test, so the exit code alone cannot catch it.
      - name: Fail if any test was skipped
        if: always()
        run: |
          skipped=$(find . -path '*-reports/TEST-*.xml' -print0 \
            | xargs -0 -r grep -ho 'skipped="[0-9]*"' \
            | grep -o '[0-9]*' \
            | awk '{s += $1} END {print s + 0}')
          echo "skipped tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped test(s) were skipped -- a test that does not run is not a pass"
            exit 1
          fi

  pipeline:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pipeline/ arrives with issue #3; until that merges this job is a no-op rather
      # than a failure, so CI is useful on main immediately.
      - name: Check whether pipeline/ exists yet
        id: probe
        run: |
          if [ -d pipeline ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pipeline/ not present on this ref -- nothing to test"
          fi

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.exists == 'true'
        with:
          python-version: '3.12'

      - name: Install and test
        if: steps.probe.outputs.exists == 'true'
        working-directory: pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pytest tests/ -v --tb=short | tee pytest-output.txt
          exit "${PIPESTATUS[0]}"

      # Same rule as the Java side: pytest exits 0 with skips, so check explicitly.
      - name: Fail if any test was skipped
        if: steps.probe.outputs.exists == 'true'
        working-directory: pipeline
        run: |
          if grep -qE '[0-9]+ skipped' pytest-output.txt; then
            echo "::error::$(grep -oE '[0-9]+ skipped' pytest-output.txt | head -1) -- a test that does not run is not a pass"
            exit 1
          fi
          echo "no skipped tests"
