# Example Spring Boot configuration for vLLM deployment
# Copy to src/main/resources/application.yml or application-local.yml

baibyname:
  llm:
    # Base URL of the OpenAI-compatible endpoint
    # For local vLLM: http://localhost:8000/v1
    # For cloud providers: https://api.provider.com/v1
    base-url: http://localhost:8000/v1

    # Model name as expected by the endpoint
    model-name: google/gemma-4-26B-A4B-it

    # API key for authentication (optional)
    # For local vLLM: leave empty or set to empty string
    # For cloud providers: set to your API key
    api-key: ""

    # Request timeout in milliseconds
    timeout-ms: 30000

# Additional Spring Boot configuration (existing settings)
spring:
  application:
    name: baiby-name
  datasource:
    url: jdbc:postgresql://localhost:5432/baibyname
    username: baibyname
    password: baibyname
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.baibyname: DEBUG
    org.flywaydb: INFO
